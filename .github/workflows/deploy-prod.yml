name: Prod Deployment

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: qarani/fargate-server:prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale.
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Prod via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker network create aws-prod-network || true
            docker pull qarani/fargate-server:prod
            docker stop fargate-server-prod || true
            docker rm fargate-server-prod || true
            docker run -d \
              --name fargate-server-prod \
              --network aws-prod-network \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -p 8086:8086 \
              -e APP_PROFILE=prod \
              -e SERVER_PORT=8086 \
              -e DOCS_PATH=/app/docs \
              -e NATS_URL=nats://nats-prod:4222 \
              -e NATS_USERNAME=nats-prod-user \
              -e NATS_PASSWORD=nats-prod-password \
              -e EUREKA_SERVER_URL=http://discovery-server-prod:8761/eureka \
              -e EUREKA_HOSTNAME=fargate-server-prod \
              -e EUREKA_IP_ADDR=fargate-server-prod \
              -e EUREKA_INSTANCE_ID=fargate-server-prod:8080 \
              -e EUREKA_VIP_ADDRESS=fargate-server \
              -e NATS_PREFIX=prod.v1 \
              qarani/fargate-server:prod




