name: Staging Deployment

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/fargate-server:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create aws-staging-network || true
            docker pull qarani/fargate-server:staging
            docker stop fargate-server-staging || true
            docker rm fargate-server-staging || true
            docker run -d --name fargate-server-staging \
              --network aws-staging-network \
              -p 8086:8086 \
              -e APP_PROFILE=staging \
              -e SERVER_PORT=8086 \
              -e DOCS_PATH=./docs
              -e NATS_URL=nats://nats-staging:4222 \
              -e NATS_USERNAME=nats-staging-user \
              -e NATS_PASSWORD=nats-staging-password \
              -e EUREKA_SERVER_URL=http://discovery-server-staging:8761/eureka \
              qarani/fargate-server:staging